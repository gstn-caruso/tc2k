name: CI and Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/release.py check-title --title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      desktop_cache_key: ${{ steps.transfer.outputs.desktop_key }}
      windows_cache_key: ${{ steps.transfer.outputs.windows_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache pinned Godot binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/godot-release
          key: godot-desktop-${{ hashFiles('release-config.json', 'tools/install_godot.py') }}
      - run: python3 tools/install_godot.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check.py
      - name: Plan semantic release
        id: release
        run: python3 tools/release.py plan --github-output "$GITHUB_OUTPUT"
      - name: Export and verify desktop packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/build_release.py --version "$RELEASE_VERSION"
      - name: Identify this attempt's package transfer
        id: transfer
        run: |
          echo "desktop_key=desktop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "windows_key=windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # Per-attempt caches transfer builds without consuming the artifact quota.
      # Exact keys and mandatory cache hits prevent using an older executable.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.transfer.outputs.windows_key }}
          path: build/release/*-windows-x86_64.zip
          enableCrossOsArchive: true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          key: ${{ steps.transfer.outputs.desktop_key }}
          path: |
            build/release
            build/release-notes.md

  windows:
    name: Windows startup
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.verify.outputs.windows_cache_key }}
          path: build/release/*-windows-x86_64.zip
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Run the exported Windows executable
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build/release/*-windows-x86_64.zip)
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows ZIP" }
          Expand-Archive -Path $archives[0].FullName -DestinationPath build/windows/extracted
          $files = @(Get-ChildItem build/windows/extracted -Recurse -Filter *.exe)
          if ($files.Count -ne 1) { throw "Expected exactly one Windows executable" }
          ./tools/check_windows.ps1 -Executable $files[0].FullName

  release:
    name: Publish release
    needs: [verify, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.verify.outputs.desktop_cache_key }}
          path: |
            build/release
            build/release-notes.md
          fail-on-cache-miss: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 tools/publish_release.py --version "$VERSION" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - name: Remove temporary package caches after publication
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEYS: ${{ needs.verify.outputs.desktop_cache_key }} ${{ needs.verify.outputs.windows_cache_key }}
        run: |
          for cache_key in $CACHE_KEYS; do
            gh cache delete "$cache_key" --repo "$GITHUB_REPOSITORY"
          done
