name: CI and Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/release.py check-title --title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      desktop_artifact_id: ${{ steps.desktop_artifact.outputs.artifact-id }}
      windows_artifact_id: ${{ steps.windows_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache pinned Godot binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/godot-release
          key: godot-desktop-${{ hashFiles('release-config.json', 'tools/install_godot.py') }}
      - run: python3 tools/install_godot.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check.py
      - name: Plan semantic release
        id: release
        run: python3 tools/release.py plan --github-output "$GITHUB_OUTPUT"
      - name: Export and verify desktop packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/build_release.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: windows_artifact
        with:
          name: windows-smoke
          path: build/release/*-windows-x86_64.zip
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: desktop_artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: desktop-release
          path: |
            build/release/*
            build/release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  windows:
    name: Windows startup
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-smoke
          path: build/windows
      - name: Run the exported Windows executable
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build/windows/*-windows-x86_64.zip)
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows ZIP" }
          Expand-Archive -Path $archives[0].FullName -DestinationPath build/windows/extracted
          $files = @(Get-ChildItem build/windows/extracted -Recurse -Filter *.exe)
          if ($files.Count -ne 1) { throw "Expected exactly one Windows executable" }
          ./tools/check_windows.ps1 -Executable $files[0].FullName

  release:
    name: Publish release
    needs: [verify, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: build
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 tools/publish_release.py --version "$VERSION" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - name: Remove temporary artifacts after publication
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_IDS: ${{ needs.verify.outputs.desktop_artifact_id }} ${{ needs.verify.outputs.windows_artifact_id }}
        run: |
          for artifact_id in $ARTIFACT_IDS; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
